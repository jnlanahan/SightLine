<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C6 · Quick answer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div style="width: 400px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.ink}}; font-family: Manrope, 'Segoe UI', sans-serif; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 2px; padding: 8px 6px; border-bottom: 1px solid {{t.line}}">
    <button type="button" aria-label="All chats" style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 10px; color: {{t.ink}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>
    </button>
    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; padding-left: 4px">
      <div style="font-size: 14px; font-weight: 700">Freeze the top row</div>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: {{t.ink2}}"><span style="width: 7px; height: 7px; border-radius: 50%; background: {{t.accent}}"></span>Watching</div>
    </div>
    <button type="button" aria-label="Mute voice" style="width: 40px; height: 44px; border: 0; background: transparent; border-radius: 10px; color: {{t.ink2}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"></path></svg>
    </button>
    <button type="button" aria-label="Pause watching" style="width: 40px; height: 44px; border: 0; background: transparent; border-radius: 10px; color: {{t.ink2}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 5v14M15 5v14"></path></svg>
    </button>
    <button type="button" aria-label="Collapse to rail" style="width: 40px; height: 44px; border: 0; background: transparent; border-radius: 10px; color: {{t.ink2}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m11 17-5-5 5-5M18 17l-5-5 5-5"></path></svg>
    </button>
    <button type="button" aria-label="Menu" style="width: 40px; height: 44px; border: 0; background: transparent; border-radius: 10px; color: {{t.ink2}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg>
    </button>
  </div>

  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 24px 20px 18px; background: {{t.card}}">
    <div style="align-self: flex-end; max-width: 86%; padding: 8px 12px; border-radius: 12px 12px 4px 12px; background: {{t.you}}; font-size: 13.5px; line-height: 1.45">How do I freeze the top row?</div>
    <p style="margin: 0; font-size: 21px; line-height: 1.35; font-weight: 600; letter-spacing: -0.3px">Open the View tab, then Freeze Panes, and pick Freeze Top Row.</p>
    <div style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: {{t.ink2}}">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="3 2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect></svg>
      Outlined on your screen
    </div>
    <p style="margin: 0; font-size: 13.5px; line-height: 1.5">Done. Row 1 stays put when you scroll.</p>

    <div style="flex-grow: 1"></div>
    <div style="display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: {{t.ink2}}">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: {{t.accent}}"></span>
      Watching quietly. No plan needed for this one.
    </div>
    <div style="display: flex; gap: 8px">
      <button type="button" style="border: 1px solid {{t.chip}}; background: transparent; color: {{t.ink}}; font: inherit; font-size: 13px; font-weight: 600; border-radius: 999px; min-height: 38px; padding: 0 14px; cursor: pointer">Freeze a column too</button>
      <button type="button" style="border: 1px solid {{t.chip}}; background: transparent; color: {{t.ink}}; font: inherit; font-size: 13px; font-weight: 600; border-radius: 999px; min-height: 38px; padding: 0 14px; cursor: pointer">Undo it</button>
    </div>
  </div>

  <div style="padding: 12px; display: flex; align-items: center; gap: 6px">
    <div style="flex-grow: 1; display: flex; align-items: center; gap: 6px; padding: 4px 4px 4px 14px; border-radius: 14px; background: {{t.input}}; border: 1px solid {{t.line}}">
      <label for="qa-input" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message the coach</label>
      <input id="qa-input" placeholder="Ask a follow-up" style="flex-grow: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 14px; color: {{t.ink}}; outline: none; height: 44px">
      <button type="button" aria-label="Hold to talk" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: {{t.btn}}; color: {{t.btnInk}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["Graphite","Porcelain","Midnight"],"default":"Graphite"},"$preview":{"width":400,"height":900}}'>
var QA_THEMES = {
  Graphite: { bg: '#17191A', card: '#1E2122', ink: '#ECEDE8', ink2: '#A3A79E', line: '#2A2E30', accent: '#9BD45A', chip: '#3A3E40', you: '#2A2E30', btn: '#ECEDE8', btnInk: '#17191A', input: '#1E2122' },
  Porcelain: { bg: '#F6F5F1', card: '#FFFFFF', ink: '#1E1F1C', ink2: '#5D5F58', line: '#DDDBD3', accent: '#3E7B3A', chip: '#CFCDC4', you: '#E9E7E0', btn: '#1E1F1C', btnInk: '#F6F5F1', input: '#FFFFFF' },
  Midnight: { bg: '#0F1626', card: '#151E31', ink: '#E8ECF4', ink2: '#9AA6BD', line: '#22304A', accent: '#6EE7B7', chip: '#2C3A57', you: '#1E2A42', btn: '#E8ECF4', btnInk: '#0F1626', input: '#151E31' }
};
class Component extends DCLogic {
  renderVals() {
    return { t: QA_THEMES[this.props.palette] || QA_THEMES.Graphite };
  }
}
</script>
</body>
</html>
